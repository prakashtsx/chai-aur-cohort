<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1 Million Checkboxes</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>1 Million Checkboxes</h1>
      <p id="connectionText">Connecting...</p>
    </div>
    <div class="userbar">
      <span id="userLabel">Anonymous</span>
      <a id="loginLink" class="button" href="/auth/login">Login</a>
      <form id="logoutForm" method="post" action="/auth/logout" hidden>
        <button type="submit">Logout</button>
      </form>
    </div>
  </header>

  <main class="layout">
    <section class="toolbar">
      <label>
        Jump to index
        <input id="jumpInput" type="number" min="0" max="999999" value="0">
      </label>
      <button id="jumpButton">Go</button>
      <div class="status-pill" id="windowText">Loading range...</div>
      <div class="status-pill" id="rateText">Ready</div>
    </section>

    <section class="grid-shell" aria-label="Checkbox grid">
      <div id="grid" class="checkbox-grid"></div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
